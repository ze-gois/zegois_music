[package]
name = "zegois_music"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/library.rs"

[dependencies]
wasm-bindgen = "0.2"
ample = { version="0.1.128", path = "../ample" }
webspace = { version="0.0.1", path = "../webspace" }
humans = { version="0.0.1", path = "../humans" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioScheduledSourceNode",
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "MouseEvent",
    "Window",
] }
